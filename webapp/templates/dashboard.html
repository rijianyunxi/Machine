{% extends "base.html" %}
{% block title %}总览{% endblock %}
{% block subtitle %}<p class="page-sub">系统运行状态与实时告警总览</p>{% endblock %}

{% block content %}
<div id="watermark"></div>

<div class="grid cards">
  <div class="stat link" onclick="location.href='/cameras'" title="进入相机管理">
    <div class="ico" id="s-cams-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
    <div><div class="k">相机状态</div><div class="v" id="c-cameras">—</div><div class="sub" id="c-cameras-sub"></div></div>
  </div>
  <div class="stat link" onclick="location.href='/alerts'" title="查看告警记录">
    <div class="ico" id="s-alerts-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
    <div><div class="k">待处理告警</div><div class="v" id="c-alerts">—</div><div class="sub" id="c-alerts-sub"></div></div>
  </div>
  <div class="stat link" onclick="location.href='/snapshots'" title="查看快照库">
    <div class="ico green" id="s-snaps-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
    <div><div class="k">快照占用</div><div class="v" id="c-snaps">—</div><div class="sub" id="c-snaps-sub"></div></div>
  </div>
  <div class="stat">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <div><div class="k">运行时长</div><div class="v" id="c-uptime">—</div><div class="sub" id="c-fps"></div></div>
  </div>
</div>

<div class="grid row2" style="margin-top:16px">
  <div class="card">
    <div class="card-title">
      <span>实时告警 <span class="muted">每 3 秒刷新</span></span>
      <span class="cam-head">
        <span id="feed-pending"></span>
        <a class="more" href="/alerts">查看全部 →</a>
      </span>
    </div>
    <div class="feed" id="alert-feed"><div class="empty"><p>加载中…</p></div></div>
  </div>
  <div class="card chart">
    <div class="card-title">
      <span>近 7 天告警趋势</span>
      <span class="legend">
        <span class="li"><span class="sw" style="background:var(--red)"></span>确认违规</span>
        <span class="li"><span class="sw" style="background:linear-gradient(180deg,#22d3ee,#4d9fff)"></span>未处理</span>
        <span class="li"><span class="sw" style="background:rgba(122,138,160,.45)"></span>误报</span>
      </span>
    </div>
    <div id="trend"></div>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <div class="card-title">
    <span>相机画面 <span class="muted">异常相机置顶 · 点击画面进入相机管理</span></span>
    <span class="cam-head">
      <span class="muted" id="cam-summary"></span>
      <span class="seg" id="cam-seg">
        <button data-f="all" class="on">全部</button>
        <button data-f="issue">仅异常</button>
      </span>
    </span>
  </div>
  <div class="snap-grid cams" id="cam-thumbs"><div class="empty" style="grid-column:1/-1"><p>加载中…</p></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const $ = id => document.getElementById(id);

function fmtUptime(s) {
  if (s == null) return "—";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function setStatusIco(el, level) {
  el.className = "ico" + (level ? " " + level : "");
}

/* ============ camera wall (scales to dozens of cameras) ============ */

let CAMS = [], camFilter = "all", camSig = "";
const camEls = new Map(), camOrder = [], camVisible = new Set();
let camScan = 0;

/* abnormal-first ordering: offline < reconnecting < online < disabled */
function camRank(c) {
  if (!c.enabled) return 3;
  if (c.connected) return 2;
  return c.thread_alive ? 1 : 0;
}

const camIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const id = e.target.closest(".cam")?.dataset.id;
    if (!id) return;
    if (e.isIntersecting) camVisible.add(id); else camVisible.delete(id);
  });
}, { threshold: 0.05 });

function renderCams(cams) {
  CAMS = cams.cameras;
  const list = CAMS
    .filter(c => camFilter === "issue" ? (c.enabled && !c.connected) : true)
    .sort((a, b) => camRank(a) - camRank(b));
  const sig = JSON.stringify([camFilter,
    list.map(c => [c.id, c.name, c.enabled, c.connected, c.thread_alive])]);
  if (sig === camSig) return;   /* unchanged → keep DOM, no image reload */
  camSig = sig;
  camEls.clear(); camOrder.length = 0; camVisible.clear();
  const box = $("cam-thumbs");
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>${
      camFilter === "issue" ? "没有离线或重连中的相机" :
      "尚未配置相机，去「相机管理」新增一路"}</p></div>`;
    return;
  }
  list.forEach(c => {
    const fig = document.createElement("figure");
    fig.className = "cam";
    fig.dataset.id = c.id;
    fig.title = "进入相机管理";
    fig.onclick = () => location.href = "/cameras";
    const media = c.enabled && c.connected
      ? `<img class="thumb" alt="${esc(c.name)}">`
      : `<div class="thumb-fallback">${c.enabled
          ? (c.thread_alive ? "重连中…" : "暂无画面") : "已停用"}</div>`;
    fig.innerHTML = `<div class="cam-media">${media}${connectedBadge(c)}</div>
      <figcaption><b>${esc(c.name)}</b>${
        c.id !== c.name ? `<span class="cid">· ${esc(c.id)}</span>` : ""}</figcaption>`;
    box.appendChild(fig);
    const img = fig.querySelector("img");
    camOrder.push(c.id);
    camEls.set(c.id, { img, ts: 0 });
    if (img) camIO.observe(img);
  });
  camScan = 0;
  camTick();
}

/* staggered thumbnail refresher: fixed per-tick budget, only on-screen
 * images, paused when the tab is hidden — keeps 40-50 cameras cheap */
const THUMB_MS = 6000;
function camTick() {
  if (document.hidden || !camOrder.length) return;
  const now = Date.now();
  let fresh = 4, cold = 8;   /* per-tick budget: refresh / first load */
  for (let n = 0; n < camOrder.length && (fresh > 0 || cold > 0); n++) {
    const id = camOrder[camScan];
    camScan = (camScan + 1) % camOrder.length;
    const c = camEls.get(id);
    if (!c || !c.img || !c.img.isConnected) continue;
    if (!camVisible.has(id) || now - c.ts < THUMB_MS) continue;
    const first = !c.img.dataset.on;
    if (first ? cold-- <= 0 : fresh-- <= 0) continue;
    c.ts = now;
    c.img.dataset.on = "1";
    c.img.src = `/api/cameras/${encodeURIComponent(id)}/frame.jpg?w=480&t=${now}`;
  }
}
setInterval(camTick, 1000);

document.querySelectorAll("#cam-seg button").forEach(b => b.onclick = () => {
  camFilter = b.dataset.f;
  document.querySelectorAll("#cam-seg button")
    .forEach(x => x.classList.toggle("on", x === b));
  camSig = "";
  renderCams({ cameras: CAMS });
});

/* ============ main refresh ============ */

async function refresh() {
  let camsData = { cameras: [] };
  try {
    const [stats, cams, usage, trend, pending] = await Promise.all([
      api("/api/system/stats"), api("/api/cameras"), api("/api/storage/usage"),
      api("/api/system/stats/history?days=7"), api("/api/alerts?status=new&limit=1")]);
    camsData = cams;

    const camsAll = cams.cameras;
    const enabled = camsAll.filter(c => c.enabled);
    const online = enabled.filter(c => c.connected);
    const offline = enabled.filter(c => !c.connected && !c.thread_alive);
    const recon = enabled.filter(c => !c.connected && c.thread_alive);
    const disabled = camsAll.length - enabled.length;
    $("c-cameras").textContent = `${online.length} / ${enabled.length}`;
    $("c-cameras-sub").innerHTML = `共 ${camsAll.length} 路` +
      (offline.length ? ` · <span class="bad">离线 ${offline.length}</span>` : "") +
      (recon.length ? ` · <span class="warn">重连 ${recon.length}</span>` : "");
    setStatusIco($("s-cams-ico"),
      offline.length ? "red" : recon.length ? "yellow" : "");

    const week = trend.trend.reduce((s, d) => s + d.total, 0);
    const pend = pending.total ?? 0;
    $("c-alerts").textContent = pend.toLocaleString("zh-CN");
    $("c-alerts").classList.toggle("alerting", pend > 0);
    $("c-alerts-sub").textContent =
      `今日 ${trend.trend.at(-1)?.total ?? 0} 条 · 近 7 天 ${week.toLocaleString("zh-CN")} 条`;
    setStatusIco($("s-alerts-ico"), pend > 0 ? "red" : "green");
    $("feed-pending").innerHTML =
      pend > 0 ? `<span class="chip red">${pend} 条待处理</span>` : "";

    $("cam-summary").innerHTML =
      `<span class="ok">在线 ${online.length}</span>` +
      (offline.length ? ` · <span class="bad">离线 ${offline.length}</span>` : "") +
      (recon.length ? ` · <span class="warn">重连 ${recon.length}</span>` : "") +
      (disabled ? ` · 停用 ${disabled}` : "");

    $("c-snaps").textContent = usage.snapshots_total_mb + " MB";
    $("c-snaps-sub").textContent =
      `磁盘已用 ${usage.disk_used_pct}% · 剩 ${usage.disk_free_gb}GB`;
    setStatusIco($("s-snaps-ico"),
      usage.watermark === "red" ? "red" : usage.watermark === "yellow" ? "yellow" : "green");

    $("c-uptime").textContent =
      stats.standalone ? "未运行" : fmtUptime(stats.uptime);
    $("c-fps").textContent = stats.standalone
      ? "独立只读模式" : `累计 ${stats.frames_processed} 帧 · ${stats.avg_fps} fps`;

    const wm = $("watermark");
    if (usage.watermark !== "ok") {
      const red = usage.watermark === "red";
      wm.innerHTML = `<div class="banner ${red ? "red" : ""}">⚠ 磁盘空间${red ? "严重不足" : "偏低"}
        （已用 ${usage.disk_used_pct}%），建议清理历史快照或缩短保留天数。</div>`;
    } else wm.innerHTML = "";

    /* stacked trend: confirmed (red) / pending (blue) / false-positive (gray),
     * bottom-up; "fill" stretches the chart to the card */
    renderBars($("trend"), trend.trend.map(d => ({
      label: d.day, value: d.total,
      segments: [
        { v: d.confirmed, c: "var(--red)", name: "确认违规" },
        { v: d.pending, c: "url(#grad)", name: "未处理" },
        { v: d.false_positive, c: "rgba(122,138,160,.45)", name: "误报" },
      ],
    })), { height: "fill" });
  } catch (e) { console.error(e); }

  try {
    const alerts = await api("/api/alerts?limit=10");
    const el = $("alert-feed");
    el.innerHTML = alerts.items.length ? alerts.items.map(a => `
      <div class="item ${a.status === "new" ? "hot"
        : (a.status === "resolved" || a.status === "false_positive") ? "dim" : ""}"
        title="${tsToTime(a.timestamp)}">
        <span class="t">${tsToTime(a.timestamp).slice(11)}</span>
        <b>${esc(a.camera_id)}</b>
        ${badge("R" + String(a.rule_id).padStart(2, "0"), "blue")}
        <span>${esc(a.rule_name)}</span>
        <span class="muted mono">conf ${a.confidence?.toFixed(2)}</span>
        ${statusBadge(a.status)}
      </div>`).join("")
      : `<div class="empty"><p>暂无告警记录</p></div>`;
  } catch (e) { console.error(e); }

  renderCams(camsData);
}

renderCams({ cameras: [] });
poll(refresh, 3000);
</script>
{% endblock %}
