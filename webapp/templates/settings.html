{% extends "base.html" %}
{% block title %}系统设置{% endblock %}
{% block subtitle %}<p class="page-sub">所有配置落盘 settings.yaml 并尽可能热生效；改动前自动备份</p>{% endblock %}

{% block content %}
<div id="pending"></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(360px,1fr))" id="sections"></div>
{% endblock %}

{% block scripts %}
<script>
async function refresh() {
  const data = await api("/api/settings");
  const pend = Object.keys(data.pending_restart || {});
  document.getElementById("pending").innerHTML = pend.length
    ? `<div class="banner">⚠ 以下配置段需重启主程序才能完全生效：${pend.map(esc).join("、")}</div>` : "";
  document.getElementById("sections").innerHTML = Object.entries(data.sections)
    .map(([section, s]) => `
    <div class="card">
      <div class="card-title" style="margin-bottom:4px">
        <span>${esc(s.label)}</span>
        ${s.restart_required ? badge("部分需重启", "yellow") : badge("即时生效", "green")}
      </div>
      ${s.keys.map(k => `
        <label>${esc(k.desc)} <span class="mono muted" style="font-size:10.5px">${section}.${k.key}</span></label>
        ${k.type === "bool"
          ? `<input type="checkbox" data-sec="${section}" data-key="${k.key}" ${k.value ? "checked" : ""}>`
          : `<input style="width:100%" data-sec="${section}" data-key="${k.key}"
               data-type="${k.type}" value="${esc(k.value)}">`}
      `).join("")}
      ${section === "llm" ? `
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
        <label>从服务获取模型列表（先保存配置再获取）</label>
        <div class="toolbar">
          <select id="llm-model-pick" style="flex:1;min-width:160px">
            <option value="">— 点「获取模型」拉取 —</option>
          </select>
          <button class="mini ghost" onclick="fetchLlmModels(this)">获取模型</button>
        </div>
        <p class="muted" style="margin-top:6px">选中模型后记得点上方「保存」。</p>
      </div>` : ""}
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        ${section === "llm"
          ? `<button class="ghost" onclick="testLlm(this)">测试连接</button>` : ""}
        <button onclick="save('${section}', this)">保存</button>
      </div>
    </div>`).join("");
}

async function save(section, btn) {
  const values = {};
  document.querySelectorAll(`[data-sec="${section}"]`).forEach(el => {
    if (el.type === "checkbox") values[el.dataset.key] = el.checked;
    else {
      const t = el.dataset.type;
      values[el.dataset.key] = t === "int" ? parseInt(el.value)
        : t === "float" ? parseFloat(el.value) : el.value;
    }
  });
  await withLoading(btn, async () => {
    try {
      const r = await api(`/api/settings/${section}`, { method: "PUT", body: values });
      toast(r.restart_required ? "已保存（部分项需重启完全生效）" : "已保存并热生效");
      refresh();
    } catch (e) { toast(e.message, false); }
  });
}

async function testLlm(btn) {
  // save current llm section first so the test uses what's on screen
  const saveBtn = btn.parentElement.querySelector("button:not(.ghost)");
  if (saveBtn) await save("llm", saveBtn);
  await withLoading(btn, async () => {
    try {
      const r = await api("/api/llm/test", { method: "POST", body: {} });
      toast(`LLM 连接正常：${r.reply}`);
    } catch (e) { toast(e.message, false); }
  });
}

async function fetchLlmModels(btn) {
  // save first so the endpoint/prod key on screen take effect
  const saveBtn = btn.closest(".card").querySelector("div[style*='justify-content'] button:not(.ghost)");
  if (saveBtn) await save("llm", saveBtn);
  await withLoading(btn, async () => {
    try {
      const r = await api("/api/llm/models", { method: "POST", body: {} });
      const sel = document.getElementById("llm-model-pick");
      sel.innerHTML = '<option value="">— 选择模型 —</option>' +
        r.models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
      toast(`获取到 ${r.models.length} 个模型`);
    } catch (e) { toast(e.message, false); }
  });
  if (document.getElementById("llm-model-pick").options.length > 1) {
    document.getElementById("llm-model-pick").onchange = e => {
      if (!e.target.value) return;
      const input = document.querySelector('[data-sec="llm"][data-key="model"]');
      if (input) input.value = e.target.value;
      toast(`已填入模型：${e.target.value}，请点保存`);
    };
  }
}
refresh();
</script>
{% endblock %}
