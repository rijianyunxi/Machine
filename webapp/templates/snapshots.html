{% extends "base.html" %}
{% block title %}快照库{% endblock %}
{% block subtitle %}<p class="page-sub">按日期 / 规则分区存储，超期自动清理</p>{% endblock %}
{% block actions %}
<button class="ghost" onclick="cleanup(this)">清理 30 天前</button>
{% endblock %}

{% block content %}
<div style="display:grid;grid-template-columns:300px 1fr;gap:16px" class="snap-layout">
  <div class="card" style="align-self:start;position:sticky;top:96px">
    <div class="card-title">按日期</div>
    <div class="date-list" id="dates"></div>
  </div>
  <div class="card">
    <div class="card-title" id="sel-title">快照</div>
    <div class="snap-grid" id="grid"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="ghost" id="more-btn" style="display:none" onclick="loadMore(this)">加载更多</button>
    </div>
  </div>
</div>
<style>@media (max-width:900px){ .snap-layout{grid-template-columns:1fr !important} .snap-layout > .card:first-child{position:static !important} }</style>
{% endblock %}

{% block scripts %}
<script>
let current = null, loadedFiles = [], loadedCount = 0, totalCount = 0;
const PAGE = 200;

async function refresh() {
  const data = await api("/api/snapshots");
  document.getElementById("dates").innerHTML = data.dates.map(d => `
    <div class="d ${current === d.date ? "active" : ""}" onclick="pick('${d.date}')">
      <b>${d.date}</b><span>${d.count} 张 · ${d.size_mb}MB</span>
    </div>`).join("") || `<div class="empty"><p>暂无快照</p></div>`;
  const active = data.dates.find(d => d.date === current) || data.dates[0];
  if (active) pick(active.date, true);
}

function pick(date, silent, offset = 0) {
  current = date;
  api(`/api/snapshots?date=${encodeURIComponent(date)}&offset=${offset}`)
    .then(data => {
    const d = data.dates[0];
    if (!d) return;
    if (offset === 0) { loadedFiles = []; document.getElementById("grid").innerHTML = ""; }
    /* the day's list grows while browsing (live detections) — an offset window
     * can re-return items already shown, so de-dup by name before appending */
    const have = new Set(loadedFiles.map(f => f.name));
    const fresh = d.files.filter(f => !have.has(f.name));
    const base = loadedFiles.length;
    loadedFiles = loadedFiles.concat(fresh);
    loadedCount = loadedFiles.length;
    totalCount = d.total;
    document.getElementById("sel-title").textContent =
      `${date} · ${d.total} 张 · ${d.size_mb} MB`;
    document.getElementById("grid").insertAdjacentHTML("beforeend", fresh.map((f, i) => `
      <figure title="${esc(f.name)} · ${f.size_kb}KB">
        <img src="${f.thumb}" loading="lazy" decoding="async" title="点击放大"
          onclick="openGallery(${base + i})">
        <figcaption>${esc(f.name)}</figcaption>
      </figure>`).join(""));
    updateMoreBtn();
    if (!silent) refresh();
  });
}

function updateMoreBtn() {
  const btn = document.getElementById("more-btn");
  const remain = totalCount - loadedCount;
  btn.style.display = remain > 0 ? "" : "none";
  btn.textContent = `加载更多（还有 ${remain} 张）`;
}

function loadMore(btn) {
  withLoading(btn, () => pick(current, true, loadedCount));
}

function openGallery(idx) {
  showGallery(loadedFiles.map(f => ({
    src: f.url, title: `${f.name} · ${f.size_kb}KB` })), idx);
}

async function cleanup(btn) {
  const d = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
  if (!await confirmDialog(`删除 ${d} 之前的所有快照目录？此操作不可恢复。`)) return;
  await withLoading(btn, async () => {
    try {
      const r = await api("/api/snapshots/cleanup", { method: "POST", body: { before_date: d } });
      toast(`已删除 ${r.deleted_dirs} 个日期目录`);
      current = null; refresh();
    } catch (e) { toast(e.message, false); }
  });
}
refresh();
</script>
{% endblock %}
