{% extends "base.html" %}
{% block title %}检测测试台{% endblock %}
{% block subtitle %}<p class="page-sub">上传图片或取相机当前帧，用已加载模型试跑；用于验证新导入模型</p>{% endblock %}

{% block content %}
<div class="grid row2">
  <div class="card">
    <div class="card-title">输入</div>
    <div class="toolbar">
      <input type="file" id="img" accept=".jpg,.jpeg,.png,.webp" style="flex:1;min-width:220px">
      <button id="run-btn" onclick="runTest(this)">开始检测</button>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <select id="cam-pick"></select>
      <button class="ghost" onclick="runCamFrame(this)">用相机当前帧</button>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <label style="margin:0;color:var(--muted)">conf 覆盖</label>
      <input style="width:90px" id="conf" type="number" step="0.05" min="0" max="1" placeholder="默认">
      <div class="inline-checks" id="model-picks" style="padding:0"></div>
    </div>
    <div style="margin-top:16px">
      <img id="annotated" class="thumb" style="display:none" title="点击放大"
        onclick="showImageModal(this.src, '检测结果')">
    </div>
  </div>
  <div class="stack">
    <div class="card">
      <div class="card-title">检测结果</div>
      <pre class="log" id="json" style="max-height:280px">等待检测…</pre>
    </div>
    <div class="card">
      <div class="card-title">最近记录</div>
      <div class="feed" id="history"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function init() {
  const cams = await api("/api/cameras");
  document.getElementById("cam-pick").innerHTML = cams.cameras
    .filter(c => c.enabled).map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`)
    .join("") || "<option value=''>无可用相机</option>";
  await loadModels();
}

async function loadModels() {
  const ms = await api("/api/models");
  document.getElementById("model-picks").innerHTML = ms.models
    .filter(m => m.loaded).map(m => `
      <label><input type="checkbox" value="${esc(m.name)}" checked> ${esc(m.name)}</label>`)
    .join("") || "<span class='muted'>没有已加载的模型</span>";
}

function pickedModels() {
  return [...document.querySelectorAll("#model-picks input:checked")].map(x => x.value).join(",");
}

async function runTest(btn) {
  const input = document.getElementById("img");
  if (!input.files.length) return toast("请先选择图片", false);
  const fd = new FormData();
  fd.append("image", input.files[0]);
  fd.append("models", pickedModels());
  const conf = document.getElementById("conf").value;
  if (conf !== "") fd.append("conf", conf);
  await withLoading(btn, async () => {
    const res = await fetch("/api/detect/test", { method: "POST", body: fd });
    handleResult(await res.json(), res.ok);
  });
}

async function runCamFrame(btn) {
  const cam = document.getElementById("cam-pick").value;
  if (!cam) return toast("无可用相机", false);
  const conf = document.getElementById("conf").value;
  const qs = new URLSearchParams({ models: pickedModels() });
  if (conf !== "") qs.set("conf", conf);
  await withLoading(btn, async () => {
    const res = await fetch(
      `/api/detect/test/camera/${encodeURIComponent(cam)}?${qs}`, { method: "POST" });
    handleResult(await res.json(), res.ok);
  });
}

function handleResult(data, ok) {
  if (!ok) { toast(data.detail || "检测失败", false); return; }
  const img = document.getElementById("annotated");
  img.src = data.annotated_url + "?t=" + Date.now();
  img.style.display = "block";
  document.getElementById("json").textContent = JSON.stringify(
    { latency_ms: data.latency_ms, models: data.models, detections: data.detections },
    null, 2);
  toast(`完成：${data.detections.length} 个目标 · ${data.latency_ms}ms`);
  loadHistory();
}

async function loadHistory() {
  const history = (await api("/api/detect/test/history")).results;
  document.getElementById("history").innerHTML = history.map(r => `
    <div class="item">
      <span class="t">${r.time}</span>
      <span>${r.detections.length} 目标</span>
      <span class="muted mono">${r.latency_ms}ms</span>
      <a href="${r.annotated_url}" target="_blank">查看</a>
    </div>`).join("") || `<div class="empty"><p>暂无记录</p></div>`;
}
init();
</script>
{% endblock %}
