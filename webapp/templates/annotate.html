{% extends "base.html" %}
{% block title %}在线标注{% endblock %}
{% block subtitle %}<p class="page-sub">画框标注 · 快捷键 1-9 选类别 / Del 删除 / ←→ 切图（自动保存）/ Ctrl+S 保存</p>{% endblock %}
{% block actions %}
<select id="ds-pick" style="min-width:180px" onchange="switchDs()"></select>
<button class="ghost" onclick="aiPrelabel(this)">⚡ YOLO 预标注</button>
<button class="ghost" onclick="rerunAi(this)">✨ AI 识别</button>
<button onclick="saveLabels(this)">保存 (Ctrl+S)</button>
{% endblock %}

{% block content %}
<div style="display:grid;grid-template-columns:250px 1fr 270px;gap:14px" class="anno-layout">
  <!-- image list -->
  <div class="card" style="padding:12px;max-height:calc(100vh - 170px);overflow-y:auto">
    <div class="card-title" style="margin-bottom:8px">图片 <span class="muted" id="img-count"></span></div>
    <div class="snap-grid" id="img-list" style="grid-template-columns:1fr 1fr;gap:8px"></div>
  </div>

  <!-- stage -->
  <div class="card" style="padding:14px">
    <div id="stage-wrap" style="position:relative;user-select:none;line-height:0">
      <img id="stage-img" class="thumb" style="aspect-ratio:auto;max-height:66vh;width:auto;max-width:100%;cursor:crosshair">
      <div id="boxes"></div>
    </div>
    <div class="toolbar" style="margin-top:12px;justify-content:space-between">
      <span class="muted" id="file-label">未选择图片</span>
      <span class="toolbar">
        <button class="mini ghost" onclick="nav(-1)">← 上一张</button>
        <span class="muted" id="pos-label">0/0</span>
        <button class="mini ghost" onclick="nav(1)">下一张 →</button>
      </span>
    </div>
  </div>

  <!-- classes & boxes -->
  <div class="stack" style="height:calc(100vh - 170px)">
    <div class="card" style="padding:14px">
      <div class="card-title" style="margin-bottom:8px">类别（按数字键选择）</div>
      <div class="inline-checks" id="class-list" style="flex-direction:column;align-items:flex-start;gap:6px"></div>
    </div>
    <div class="card box-card" style="padding:14px">
      <div class="tabs">
        <button class="tab on" data-t="manual" onclick="setBoxTab('manual')">标注框 <span id="box-count"></span></button>
        <button class="tab" data-t="ai" onclick="setBoxTab('ai')">AI 识别 <span id="ai-count"></span></button>
      </div>
      <div class="feed" id="box-list" style="flex:1;min-height:0;max-height:none"></div>
      <button class="mini" id="promote-btn" style="display:none;width:100%;margin-top:8px"
        onclick="promoteAi(this)">加入所选 (<span id="ai-n2">0</span>)</button>
      <div id="ai-prompt-box" style="display:none;margin-top:10px">
        <details class="ai-prompt-details" ontoggle="openPromptEditor(this)">
          <summary title="默认折叠，点开可修改提示词">
            <span>提示词</span>
            <span class="mini ghost" style="margin-left:auto;padding:1px 8px"
              onclick="event.preventDefault();resetPrompt()">恢复默认</span>
          </summary>
          <textarea id="ai-prompt" rows="4" spellcheck="false" oninput="autoGrowPrompt()"
            placeholder="告诉 AI 要检测什么目标、输出格式要求…"></textarea>
        </details>
        <button class="mini" style="width:100%;margin-top:8px" onclick="rerunAi(this)">🔄 重新识别</button>
      </div>
    </div>
  </div>
</div>

<style>
@media (max-width:1100px){ .anno-layout{grid-template-columns:1fr !important} }
.anno-box{position:absolute;border:2px solid var(--accent);cursor:pointer;box-sizing:border-box}
.anno-box.sel{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.anno-box .tag{position:absolute;top:-19px;left:-2px;background:var(--accent);color:#04121f;
  font-size:10px;font-weight:600;padding:1.5px 6px;border-radius:4px;white-space:nowrap;line-height:1.4}
.anno-box.sel .tag{background:var(--yellow)}
.anno-box .rz{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;
  background:var(--yellow);border-radius:2px;cursor:nwse-resize}
.anno-ghost{position:absolute;border:2px dashed var(--yellow);pointer-events:none}
#boxes{position:absolute;inset:0;pointer-events:none}
#boxes .anno-box{pointer-events:auto}
#stage-wrap{margin:0 auto;width:fit-content}
.anno-box.llm{border-style:dashed;border-color:var(--green)}
.anno-box.llm .tag{background:var(--green);color:#04121f}
.stage-loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:rgba(4,8,16,.55);backdrop-filter:blur(2px);border-radius:10px}
.spinner{width:26px;height:26px;margin:0 auto 8px;border:3px solid var(--border-strong);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.cls-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  cursor:pointer;border:1px solid transparent}
.cls-row:hover{background:var(--surface-2)}
.cls-row.active{background:var(--accent-soft);border-color:rgba(77,159,255,.35)}
.cls-dot{width:13px;height:13px;border-radius:4px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.25)}
.llm-pv{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  border:1px solid var(--border);margin-bottom:5px;font-size:12px;cursor:pointer}
.llm-pv:hover{background:var(--surface-3)}
.llm-pv.dimmed{opacity:.45}
.llm-pv.sel{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.llm-pv input{width:13px;height:13px;flex-shrink:0}
.llm-pv .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;
  border:1px dashed var(--green);background:rgba(52,211,153,.15)}
#ai-prompt{width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.55;
  min-height:64px;resize:vertical;overflow:hidden;margin-top:8px}
/* box card: fixed height, list scrolls, prompt docked at the bottom */
.box-card{flex:1;min-height:0;display:flex;flex-direction:column}
.ai-prompt-details{border:1px solid var(--border);border-radius:9px;
  background:var(--surface);padding:7px 10px}
.ai-prompt-details summary{cursor:pointer;font-size:12px;color:var(--text-2);
  display:flex;align-items:center;gap:6px;list-style:none;white-space:nowrap}
.ai-prompt-details summary::-webkit-details-marker{display:none}
.ai-prompt-details summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.ai-prompt-details[open] summary::before{transform:rotate(90deg)}
.ai-prompt-details[open] summary{margin-bottom:2px}
.tabs{display:flex;gap:4px;margin-bottom:10px;background:var(--surface-2);
  border-radius:9px;padding:3px}
.tabs .tab{flex:1;background:transparent;border:none;color:var(--text-2);
  padding:5px 8px;font-size:12px;font-weight:500;border-radius:7px}
.tabs .tab:hover{color:var(--text);filter:none}
.tabs .tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
</style>
{% endblock %}

{% block scripts %}
<script>
const qs = new URLSearchParams(location.search);
let ds = qs.get("ds") || "", images = [], idx = -1, boxes = [], classes = [],
    curCls = 0, sel = -1, dirty = false,
    boxTab = "manual",        /* which list the right card shows: manual | ai */
    loadingLabels = false;
const stage = document.getElementById("stage-wrap");
const imgEl = document.getElementById("stage-img");
const boxLayer = document.getElementById("boxes");

/* distinct color per class id (golden-angle hue) */
function clsColor(i) {
  return `hsl(${Math.round((i * 137.508) % 360)}, 68%, 58%)`;
}

function setCls(i) {
  curCls = i;
  if (sel >= 0 && boxes[sel]) { boxes[sel].cls = i; markDirty(); renderBoxes(); renderBoxList(); }
  renderClasses();
}

/* ---------- dataset / image list ---------- */

async function init() {
  const dsList = (await api("/api/datasets")).datasets;
  document.getElementById("ds-pick").innerHTML = dsList.map(d =>
    `<option value="${esc(d.name)}" ${d.name === ds ? "selected" : ""}>${esc(d.name)}</option>`).join("");
  if (!ds && dsList.length) { ds = dsList[0].name; document.getElementById("ds-pick").value = ds; }
  if (!ds) { toast("请先到「数据集」页创建数据集", false); return; }
  await loadInfo();
  await loadImages();
  if (idx < 0 && images.length) await jump(0);
}

async function switchDs() { ds = document.getElementById("ds-pick").value; idx = -1; await loadInfo(); await loadImages(); if (images.length) await jump(0); }

async function loadInfo() {
  const info = await api(`/api/datasets/${encodeURIComponent(ds)}`);
  classes = info.classes;
  renderClasses();
}

async function loadImages() {
  images = (await api(`/api/datasets/${encodeURIComponent(ds)}/images`)).images;
  document.getElementById("img-count").textContent = images.length;
  document.getElementById("img-list").innerHTML = images.map((im, i) => `
    <figure style="margin:0;cursor:pointer" onclick="jump(${i})">
      <img src="/api/datasets/${encodeURIComponent(ds)}/image/${esc(im.file)}"
        loading="lazy" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;
        border:2px solid ${i === idx ? "var(--yellow)" : "var(--border)"}">
      <figcaption style="font-size:10px;margin-top:2px;display:flex;justify-content:space-between">
        <span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(im.file.slice(0, 12))}</span>
        <span>${im.labeled ? "✅" : "⬜"}</span>
      </figcaption>
    </figure>`).join("") || `<div class="empty"><p>数据集为空，回数据集页导入图片</p></div>`;
}

function renderClasses() {
  document.getElementById("class-list").innerHTML = classes.map((c, i) => `
    <div class="cls-row ${i === curCls ? "active" : ""}" onclick="setCls(${i})">
      <span class="cls-dot" style="background:${clsColor(i)}"></span>
      <span class="chip plain" style="font-size:10.5px">${i}</span>
      <span>${esc(c)}</span>
      ${i === curCls ? '<span style="margin-left:auto;color:var(--accent)">✓</span>' : ""}
    </div>`).join("");
}

/* ---------- load / save current image ---------- */

async function jump(i, keepDirty = false) {
  if (dirty && !keepDirty) await saveLabels(null, true);
  idx = i; sel = -1;
  if (idx < 0 || idx >= images.length) { idx = images.length ? 0 : -1; }
  if (idx < 0) return;
  const im = images[idx];
  loadingLabels = true;
  imgEl.src = `/api/datasets/${encodeURIComponent(ds)}/image/${esc(im.file)}`;
  document.getElementById("file-label").textContent = im.file;
  document.getElementById("pos-label").textContent = `${idx + 1}/${images.length}`;
  boxes = (await api(`/api/datasets/${encodeURIComponent(ds)}/labels/${esc(im.stem)}`)).boxes;
  loadingLabels = false;
  dirty = false;
  renderBoxes(); renderBoxList(); highlightThumb();
}

function highlightThumb() {
  document.querySelectorAll("#img-list figure").forEach((f, i) => {
    f.querySelector("img").style.borderColor = i === idx ? "var(--yellow)" : "var(--border)";
  });
}

async function saveLabels(btn, silent = false) {
  if (idx < 0 || !dirty) return;
  const im = images[idx];
  const manual = boxes.filter(b => !b._ai);   // AI suggestions are not saved
  await api(`/api/datasets/${encodeURIComponent(ds)}/labels/${esc(im.stem)}`,
    { method: "PUT", body: { boxes: manual } });
  dirty = false; im.labeled = manual.length > 0;
  if (!silent) toast(`已保存 ${manual.length} 个框`);
  renderBoxList();
}

async function nav(d) {
  if (!images.length) return;
  const next = Math.min(Math.max(idx + d, 0), images.length - 1);
  if (next === idx) return;
  await jump(next);
}

/* ---------- box rendering & editing ---------- */

function renderBoxes() {
  // position layer to match rendered image (needed for tag clamping below)
  const r = imgEl.getBoundingClientRect(), pr = stage.getBoundingClientRect();
  boxLayer.style.left = (r.left - pr.left) + "px";
  boxLayer.style.top = (r.top - pr.top) + "px";
  boxLayer.style.width = r.width + "px";
  boxLayer.style.height = r.height + "px";
  // the canvas follows the active tab: manual boxes on 标注框, AI boxes on AI 识别
  const shown = boxes
    .map((b, i) => ({ b, i }))
    .filter(x => boxTab === "ai" ? !!x.b._ai : !x.b._ai);
  boxLayer.innerHTML = shown.map(({ b, i }) => {
    const x = (b.x - b.w / 2) * 100, y = (b.y - b.h / 2) * 100;
    const name = classes[b.cls] ?? `cls${b.cls}`;
    const col = clsColor(b.cls);
    // tags above a box at the very top of the image would get clipped
    const tagInside = (b.y - b.h / 2) * r.height < 22;
    return `<div class="anno-box ${b._ai ? "llm" : ""} ${i === sel ? "sel" : ""}" data-i="${i}"
      style="left:${x}%;top:${y}%;width:${b.w * 100}%;height:${b.h * 100}%;border-color:${col};
      ${b._ai && !b._aiChecked ? "opacity:.3" : ""}">
      <span class="tag" style="background:${col};${tagInside ? "top:2px" : ""}">${b.cls}:${esc(name)}</span><span class="rz"></span></div>`;
  }).join("");
}
window.addEventListener("resize", renderBoxes);
imgEl.addEventListener("load", renderBoxes);

function renderBoxList() {
  const manual = boxes.map((b, i) => ({ b, i })).filter(x => !x.b._ai);
  const ai = boxes.map((b, i) => ({ b, i })).filter(x => x.b._ai);
  document.getElementById("box-count").textContent = manual.length;
  document.getElementById("ai-count").textContent = ai.length;
  const list = document.getElementById("box-list");
  const showAi = boxTab === "ai";
  document.getElementById("ai-prompt-box").style.display = showAi ? "" : "none";
  const promote = document.getElementById("promote-btn");
  promote.style.display = showAi && ai.length ? "" : "none";
  if (showAi) {
    const n = ai.filter(x => x.b._aiChecked).length;
    document.getElementById("ai-n2").textContent = n;
    list.innerHTML = ai.map(({ b, i }) => {
      const name = classes[b.cls] ?? `cls${b.cls}`;
      return `<div class="llm-pv ${b._aiChecked ? "" : "dimmed"} ${i === sel ? "sel" : ""}"
        onclick="sel=${i};renderBoxes();renderBoxList()">
        <input type="checkbox" ${b._aiChecked ? "checked" : ""}
          onclick="event.stopPropagation()"
          onchange="boxes[${i}]._aiChecked=this.checked;renderBoxList();renderBoxes()">
        <span class="cls-dot" style="background:${clsColor(b.cls)}"></span>
        <span>${esc(name)}</span>
        <span class="muted mono" style="margin-left:auto">${(b.w * 100).toFixed(0)}×${(b.h * 100).toFixed(0)}</span>
      </div>`;
    }).join("") || '<p class="muted" style="font-size:12px">还没有 AI 识别结果。编辑提示词后点「重新识别」，勾选后再「加入所选」。</p>';
    return;
  }
  list.innerHTML = manual.map(({ b, i }) => `
    <div class="item" style="cursor:pointer;${i === sel ? "color:var(--yellow)" : ""}"
      onclick="sel=${i};renderBoxes();renderBoxList()">
      <span class="cls-dot" style="background:${clsColor(b.cls)}"></span>
      <span>${esc(classes[b.cls] ?? "cls" + b.cls)}</span>
      <span class="muted mono" style="margin-left:auto">${(b.w * 100).toFixed(0)}×${(b.h * 100).toFixed(0)}</span>
      <button class="mini danger" style="padding:1px 7px"
        onclick="event.stopPropagation();delBox(${i})">✕</button>
    </div>`).join("") || '<p class="muted">暂无标注框，在图上拖拽画框</p>';
}

function setBoxTab(t) {
  boxTab = t;
  const cur = boxes[sel];
  if (cur && ((t === "ai") !== !!cur._ai)) sel = -1;   // selection belongs to the other tab
  syncTabs();
  renderBoxList();
  renderBoxes();          // canvas dim state follows the checked boxes
  if (t === "ai") autoGrowPrompt();
}

function syncTabs() {
  document.querySelectorAll(".tabs .tab").forEach(b =>
    b.classList.toggle("on", b.dataset.t === boxTab));
}

/* checked AI suggestions become regular boxes; unchecked ones are discarded */
function promoteAi() {
  const keep = boxes.filter(b => b._ai && b._aiChecked);
  if (!keep.length) return toast("先勾选要加入的建议框", false);
  boxes = boxes
    .filter(b => !b._ai || b._aiChecked)
    .map(b => b._ai ? { cls: b.cls, x: b.x, y: b.y, w: b.w, h: b.h } : b);
  dirty = true; sel = -1;
  boxTab = "manual";
  syncTabs();
  renderBoxes(); renderBoxList();
  toast(`已加入 ${keep.length} 个 AI 框（记得保存）`);
}

function markDirty() { dirty = true; }
function delBox(i) { boxes.splice(i, 1); if (sel === i) sel = -1; markDirty(); renderBoxes(); renderBoxList(); }

/* draw / move / resize */
let drag = null;

stage.addEventListener("mousedown", e => {
  if (e.target === imgEl) {           // start drawing a new box
    const r = imgEl.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    if (px < 0 || px > 1 || py < 0 || py > 1) return;
    drag = { mode: "draw", x0: px, y0: py };
    e.preventDefault();
  }
});

boxLayer.addEventListener("mousedown", e => {
  const boxEl = e.target.closest(".anno-box");
  if (!boxEl) return;
  e.stopPropagation(); e.preventDefault();
  const i = +boxEl.dataset.i; sel = i;
  renderBoxes(); renderBoxList();
  const b = boxes[i];
  if (e.target.classList.contains("rz")) drag = { mode: "resize", i };
  else drag = { mode: "move", i, dx: b.x, dy: b.y,
                mx: (e.clientX), my: (e.clientY), bw: b.w, bh: b.h };
});

document.addEventListener("mousemove", e => {
  if (!drag) return;
  const r = imgEl.getBoundingClientRect();
  const px = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  const py = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
  if (drag.mode === "draw") {
    document.querySelectorAll(".anno-ghost").forEach(g => g.remove());
    const g = document.createElement("div");
    g.className = "anno-ghost";
    const x0 = Math.min(drag.x0, px), y0 = Math.min(drag.y0, py);
    g.style.left = x0 * 100 + "%"; g.style.top = y0 * 100 + "%";
    g.style.width = Math.abs(px - drag.x0) * 100 + "%";
    g.style.height = Math.abs(py - drag.y0) * 100 + "%";
    boxLayer.appendChild(g);
    drag.cur = { x: (x0 + px) / 2, y: (y0 + py) / 2,
                 w: Math.abs(px - drag.x0), h: Math.abs(py - drag.y0) };
  } else if (drag.mode === "move") {
    const b = boxes[drag.i];
    b.x = Math.min(Math.max(drag.dx + (e.clientX - drag.mx) / r.width, b.w / 2), 1 - b.w / 2);
    b.y = Math.min(Math.max(drag.dy + (e.clientY - drag.my) / r.height, b.h / 2), 1 - b.h / 2);
  } else if (drag.mode === "resize") {
    const b = boxes[drag.i];
    b.w = Math.min(Math.max(px - (b.x - b.w / 2), 0.01), 1 - (b.x - b.w / 2));
    b.h = Math.min(Math.max(py - (b.y - b.h / 2), 0.01), 1 - (b.y - b.h / 2));
  }
  if (drag.mode !== "draw") { markDirty(); renderBoxes(); }
});

document.addEventListener("mouseup", () => {
  if (!drag) return;
  if (drag.mode === "draw") {
    document.querySelectorAll(".anno-ghost").forEach(g => g.remove());
    const c = drag.cur;
    if (c && c.w > 0.01 && c.h > 0.01) {
      boxes.push({ cls: curCls, x: c.x, y: c.y, w: c.w, h: c.h });
      sel = boxes.length - 1; markDirty();
      // hand-drawn boxes are manual ones — show them on the 标注框 tab
      if (boxTab !== "manual") { boxTab = "manual"; syncTabs(); renderBoxList(); }
    }
  } else markDirty();
  drag = null; renderBoxes(); renderBoxList();
});

/* keyboard */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (/^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (i < classes.length) setCls(i);
  } else if (e.key === "Delete" || e.key === "Backspace") {
    if (sel >= 0) delBox(sel);
  } else if (e.key === "ArrowLeft") nav(-1);
  else if (e.key === "ArrowRight") nav(1);
  else if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveLabels(); }
});

/* ---------- AI assists ---------- */

function showStageLoading(text) {
  const ov = document.createElement("div");
  ov.className = "stage-loading";
  ov.innerHTML = `<div style="text-align:center">
    <div class="spinner"></div>
    <div class="lv" style="font-size:12.5px">${esc(text)}</div></div>`;
  stage.appendChild(ov);
  return ov;
}

async function aiPrelabel(btn) {
  if (idx < 0) return toast("先选择图片", false);
  if (loadingLabels) return toast("图片标注加载中，请稍候", false);
  const ov = showStageLoading("本地模型推理中…");
  try {
    const im = images[idx];
    const newBoxes = await detectToBoxes(im);
    if (!newBoxes.length) {
      toast("未检出目标，已保留原标注", false);
      return;
    }
    await api(`/api/datasets/${encodeURIComponent(ds)}/labels/${esc(im.stem)}`,
      { method: "PUT", body: { boxes: newBoxes } });
    boxes = newBoxes;
    dirty = true; renderBoxes(); renderBoxList();
    toast(`AI 预标注完成：${boxes.length} 个框（记得保存）`);
  } catch (e) { toast(e.message, false); }
  finally { ov.remove(); }
}

async function detectToBoxes(im) {
  // fetch image, send to the detect-test endpoint with the loaded models
  const blob = await fetch(`/api/datasets/${encodeURIComponent(ds)}/image/${esc(im.file)}`).then(r => r.blob());
  const fd = new FormData();
  fd.append("image", blob, im.file);
  fd.append("conf", 0.4);
  const d = await api2("/api/detect/test", fd);
  const shape = await imgSize(im);
  return d.detections.map(x => {
    const [x1, y1, x2, y2] = x.bbox;
    return { cls: classIdOf(x.class_name),
             x: ((x1 + x2) / 2) / shape.w, y: ((y1 + y2) / 2) / shape.h,
             w: (x2 - x1) / shape.w, h: (y2 - y1) / shape.h };
  });
}

async function api2(url, fd) {
  const res = await fetch(url, { method: "POST", body: fd });
  if (!res.ok) throw new Error((await res.json()).detail || "检测失败");
  return res.json();
}

async function imgSize(im) {
  return new Promise(resolve => {
    const i = new Image();
    i.onload = () => resolve({ w: i.naturalWidth, h: i.naturalHeight });
    i.src = `/api/datasets/${encodeURIComponent(ds)}/image/${esc(im.file)}`;
  });
}

function classIdOf(name) {
  const i = classes.findIndex(c => c.toLowerCase() === String(name).toLowerCase());
  return i >= 0 ? i : 0;
}

/* ---------- AI 识别 ---------- */

function llmPrompt() {
  const allowed = classes.map((c, i) => `${i}:${c}`).join(", ");
  return "你是工地安全行为标注助手。请检测图中的目标，只允许使用以下类别（label 必须逐字取自该列表，禁止编造其它类别）：" +
    allowed + "。仅输出一个 JSON 数组，不要输出任何解释：" +
    '[{"label":"类别名","x":0.5,"y":0.5,"w":0.2,"h":0.3}]' +
    "，x/y 为框中心点、w/h 为框宽高，均按图片尺寸归一化到 0~1。图中没有这些类别目标时输出 []。";
}

/* grow the prompt box with its content so no line is ever clipped */
function autoGrowPrompt() {
  const ta = document.getElementById("ai-prompt");
  ta.style.height = "auto";
  ta.style.height = Math.min(Math.max(ta.scrollHeight, 64), 240) + "px";
}

/* details 展开/预填：折叠时提示词不占空间，展开时预填默认并自适应 */
function openPromptEditor(d) {
  if (!d.open) return;
  const ta = document.getElementById("ai-prompt");
  if (!ta.value.trim()) ta.value = llmPrompt();
  autoGrowPrompt();
}

function resetPrompt() {
  const ta = document.getElementById("ai-prompt");
  ta.value = llmPrompt();
  autoGrowPrompt();
}

async function fetchImageB64(im) {
  const blob = await fetch(
    `/api/datasets/${encodeURIComponent(ds)}/image/${esc(im.file)}`).then(r => r.blob());
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.readAsDataURL(blob);
  });
}

/* ✨ AI 识别 button / 识别 button: run the LLM with the prompt in the AI tab.
 * Results land in the AI 识别 tab as dashed boxes (unchecked = dimmed);
 * the current manual boxes stay on the image untouched. */
async function rerunAi(btn) {
  if (idx < 0) return toast("先选择图片", false);
  if (loadingLabels) return toast("图片标注加载中，请稍候", false);
  let ta = document.getElementById("ai-prompt");
  if (!ta.value.trim()) ta.value = llmPrompt();
  const prompt = ta.value.trim();
  await withLoading(btn, async () => {
    const ov = showStageLoading("AI 识别中…");
    let secs = 0;
    const timer = setInterval(() => {
      secs += 1;
      ov.querySelector(".lv").textContent = `AI 识别中… ${secs}s`;
    }, 1000);
    try {
      const im = images[idx];
      const b64 = await fetchImageB64(im);
      const r = await api("/api/llm/chat",
        { method: "POST", body: { prompt, image: b64, classes } });
      if (r.boxes?.length) {
        boxes = boxes.filter(b => !b._ai);   // replace previous suggestions
        r.boxes.forEach(b => boxes.push({ ...b, _ai: true, _aiChecked: true }));
        boxTab = "ai";
        setBoxTab("ai");
        toast(`AI 识别出 ${r.boxes.length} 个框，勾选后「加入所选」`);
      } else {
        toast("AI 未返回可用框，可修改提示词后重试", false);
      }
    } catch (e) { toast(e.message, false); }
    finally { clearInterval(timer); ov.remove(); }
  });
}

init();
</script>
