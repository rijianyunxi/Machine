{% extends "base.html" %}
{% block title %}相机管理{% endblock %}
{% block subtitle %}<p class="page-sub">新增 / 编辑即时热生效，无需重启检测程序</p>{% endblock %}
{% block actions %}
<button onclick="openEdit(null, this)">＋ 新增相机</button>
{% endblock %}

{% block content %}
<div class="card">
  <div class="table-wrap"><table>
    <thead><tr>
      <th>状态</th><th>ID / 名称</th><th>地址</th><th>规则</th>
      <th>已采帧</th><th>最后帧龄</th><th style="text-align:right">操作</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-h"><h3 id="m-title">新增相机</h3>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="form-grid">
        <div><label>相机 ID（唯一，保存后不可改）</label>
          <input id="f-id" class="w240" placeholder="CAM_001"></div>
        <div><label>名称</label>
          <input id="f-name" class="w240" placeholder="车间北门"></div>
      </div>
      <label>RTSP 地址 / 本地视频路径</label>
      <input id="f-url" style="width:100%" placeholder="rtsp://用户名:密码@IP:554/... 或 test_videos/demo.mp4">
      <label>启用规则（多选）</label>
      <div class="inline-checks" id="f-rules"></div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text);margin-top:14px;cursor:pointer">
        <input type="checkbox" id="f-enabled" checked> 启用该相机
      </label>
    </div>
    <div class="modal-f">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button id="save-btn" onclick="saveCamera(this)">保存</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let RULES = [], editing = null;

async function loadRules() {
  const r = await api("/api/rules");
  RULES = r.rules;
  document.getElementById("f-rules").innerHTML = RULES.map(x => `
    <label><input type="checkbox" value="${x.id}">
      <span class="chip blue plain">R${String(x.id).padStart(2, "0")}</span>${esc(x.name)}</label>
  `).join("") || "<span class='muted'>尚无规则，请先到「规则配置」新建</span>";
}

function render(cams) {
  document.getElementById("rows").innerHTML = cams.cameras.map(c => `
    <tr>
      <td>${connectedBadge(c)}</td>
      <td><b>${esc(c.id)}</b><div class="muted" style="font-size:12px">${esc(c.name)}</div></td>
      <td class="mono" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.url)}">${esc(c.url)}</td>
      <td>${(c.rules || []).map(r => badge("R" + String(r).padStart(2, "0"), "blue")).join(" ") || '<span class="muted">未分配</span>'}</td>
      <td class="mono">${c.frames_captured ?? "—"}</td>
      <td class="mono">${c.frame_age != null ? c.frame_age + "s" : "—"}</td>
      <td class="actions" style="text-align:right">
        <button class="mini ghost" onclick="openEdit('${esc(c.id)}')">编辑</button>
        <button class="mini ghost" onclick="restartCam('${esc(c.id)}', this)">重连</button>
        <button class="mini danger" onclick="delCam('${esc(c.id)}', this)">删除</button>
      </td>
    </tr>`).join("")
    || `<tr><td colspan="7"><div class="empty"><p>尚未配置相机</p></div></td></tr>`;
}

function openEdit(id) {
  editing = id;
  api("/api/cameras").then(({ cameras }) => {
    const cam = cameras.find(c => c.id === id);
    document.getElementById("m-title").textContent = id ? `编辑相机 · ${id}` : "新增相机";
    document.getElementById("f-id").value = cam?.id || "";
    document.getElementById("f-id").disabled = !!id;
    document.getElementById("f-name").value = cam?.name || "";
    const urlEl = document.getElementById("f-url");
    urlEl.value = cam?.url.includes("****") ? "" : (cam?.url || "");
    urlEl.placeholder = cam?.url.includes("****")
      ? "已保存（出于安全显示为 ****，留空保持原地址）" : "rtsp://... 或本地视频路径";
    document.getElementById("f-enabled").checked = cam ? cam.enabled : true;
    document.querySelectorAll("#f-rules input").forEach(cb => {
      cb.checked = !!(cam && (cam.rules || []).includes(+cb.value));
    });
    document.getElementById("modal").classList.add("open");
  });
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }

async function saveCamera(btn) {
  const urlField = document.getElementById("f-url").value;
  const body = {
    id: document.getElementById("f-id").value.trim(),
    name: document.getElementById("f-name").value.trim(),
    enabled: document.getElementById("f-enabled").checked,
    rules: [...document.querySelectorAll("#f-rules input:checked")].map(x => +x.value),
  };
  if (urlField && !urlField.includes("****")) body.rtsp_url = urlField;
  await withLoading(btn, async () => {
    try {
      if (editing) await api(`/api/cameras/${encodeURIComponent(editing)}`, { method: "PUT", body });
      else await api("/api/cameras", { method: "POST", body });
      toast(editing ? "已保存并热生效" : "已新增并热生效");
      closeModal(); refresh();
    } catch (e) { toast(e.message, false); }
  });
}

async function restartCam(id, btn) {
  await withLoading(btn, async () => {
    try { await api(`/api/cameras/${encodeURIComponent(id)}/restart`, { method: "POST" }); toast("已触发重连"); }
    catch (e) { toast(e.message, false); }
  });
}
async function delCam(id, btn) {
  if (!await confirmDialog(`确认删除相机 ${id}？将同时从 cameras.yaml 移除，历史告警保留。`)) return;
  await withLoading(btn, async () => {
    try { await api(`/api/cameras/${encodeURIComponent(id)}`, { method: "DELETE" }); toast("已删除"); refresh(); }
    catch (e) { toast(e.message, false); }
  });
}

const refresh = () => api("/api/cameras").then(render).catch(console.error);
loadRules().then(refresh);
poll(refresh, 5000);
</script>
{% endblock %}
