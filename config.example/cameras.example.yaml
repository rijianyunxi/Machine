# ============================================================
# 相机通道配置（示例）—— 复制为 config/cameras.yaml 后填写真实值
# ============================================================
# 每路相机：
#   id:        唯一标识
#   name:      显示名
#   rtsp_url:  RTSP 地址（或本地视频路径，便于离线开发）
#   enabled:   是否启用
#   rules:     启用的规则 ID 列表（规则在 config/rules.yaml 定义）
#
# 注意：rtsp_url 内嵌相机账密，本文件已在 .gitignore 中排除，勿提交真实密码。
# 建议：本地开发可指向 mp4 文件（scripts/make_test_video.py 可生成测试视频）。

cameras:
  - id: "CAM_001"
    name: "示例工地入口"
    rtsp_url: "rtsp://用户名:密码@192.168.1.64:554/Streaming/Channels/101?tcp"  # 海康示例
    # rtsp_url: "rtsp://admin:密码@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1"  # 大华示例（子码流，检测推荐）
    # rtsp_url: "test_videos/bus.mp4"  # 本地视频
    enabled: true
    rules: [1, 13, 14]
