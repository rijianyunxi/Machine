# ============================================================
# Camera Channel Configuration
# ============================================================
# Each camera defines:
#   id:          Unique camera identifier
#   name:        Human-readable name
#   rtsp_url:    RTSP stream URL
#   enabled:     Whether this camera is active
#   rules:       List of active detection rule IDs for this camera
#   zones:       Optional ROI zones for zone-based rules (polygon points)
#
# Rule IDs reference:
#   1  - No safety helmet
#   2  - No life jacket
#   3  - No safety harness (scaffold)
#   4  - Hot work supervisor absence
#   5  - High-altitude supervisor absence
#   6  - Walking/working on pipes
#   7  - No safety harness (high-altitude)
#   8  - Crossing railings
#   9  - Electrical work supervisor absence
#   10 - Confined space supervisor absence
#   11 - Lifting commander departure
#   12 - Unauthorized personnel in lifting zone
#   13 - Smoking in no-fire zone
# ============================================================



#   检测规则 rules: [1, 13, 14]  # Helmet, smoking, cigarette-in-hand
