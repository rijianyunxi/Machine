# ============================================================
# 相机通道配置
# ============================================================
# 每路相机可配置以下字段：
#   id:          相机唯一标识
#   name:        相机显示名称
#   rtsp_url:    RTSP 流地址（或本地视频路径）
#   enabled:     是否启用该相机
#   rules:       该相机启用的检测规则 ID 列表
#   zones:       可选 ROI 检测区域，用于区域类规则（多边形坐标）
#
# 规则 ID 参考：
#   1  - 未戴安全帽
#   2  - 未穿救生衣
#   3  - 未系安全带（脚手架作业）
#   4  - 动火作业监护人离岗
#   5  - 高处作业监护人离岗
#   6  - 在管道上行走/作业
#   7  - 未系安全带（高处作业）
#   8  - 翻越栏杆
#   9  - 电气作业监护人离岗
#   10 - 有限空间作业监护人离岗
#   11 - 吊装指挥人员离岗
#   12 - 无关人员进入吊装区域
#   13 - 禁火区吸烟
#   14 - 持烟（禁火区手持香烟）
# ============================================================



#   检测规则示例：rules: [1, 13, 14]  # 未戴安全帽、禁火区吸烟、持烟
cameras:
