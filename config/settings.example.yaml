# ============================================================
# 全局配置
# ============================================================

# 检测模型配置（支持多模型）
model:
  # 所有模型共用的基础检测参数
  confidence_threshold: 0.5  # 最低置信度阈值
  iou_threshold: 0.45  # NMS IoU 阈值
  img_size: 640  # 推理输入图片尺寸
  device: "auto"  # 设备类型：auto/cpu/cuda:0 等

  # 模型列表：可同时加载多个模型
  # 每个模型可配置：name、path、enabled、rules（可选）
  models:
    # PPE 检测模型（安全帽、反光衣、人员等类别）
    - name: "ppe"
      path: "models/yolov8-ppe.pt"
      enabled: true
      rules: [1]

    # 吸烟检测模型（烟头、吸烟行为等类别）
    - name: "smoking"
      path: "models/yolov8-smoking.pt"
      enabled: true
      confidence_override: 0.6
      rules: [13]

  # 旧版单模型配置；models 列表为空时才会使用
  # path: "models/yolov8-ppe.pt"

# 视频抓帧配置
capture:
  target_fps: 2  # 目标处理帧率（帧/秒）
  reconnect_delay: 5  # 断流后重连等待时间（秒）
  # RTSP 流会持续读取；连续读取失败达到该次数后强制重连。
  # 在持续排空帧的模式下，通常约 1 秒内触发。
  max_failures: 5  # 连续读取失败次数阈值
  read_timeout: 10  # 单次读取帧的超时时间（秒）
  # 重连后丢弃的帧数；让 H.264 解码器先同步到关键帧，再进入分析流程。
  warmup_frames: 5  # 重连后丢弃的热身帧数量
  # 连续多少秒没有读到新帧时强制重连（卡流兜底保护）。
  stall_timeout: 15  # 无帧卡流判定时间（秒）

# 快照配置
snapshot:
  save_dir: "storage/snapshots"  # 快照保存目录
  jpeg_quality: 90  # JPEG 图片质量（1-100）
  annotate: true  # 是否在快照上绘制检测框/标签
  box_thickness: 2  # 检测框线宽
  font_scale: 0.6  # 标签字号
  # 超过保留天数的快照日期目录每天 03:00 自动清理
  retention_days: 30  # 快照保留天数

# 告警配置
alert:
  cooldown_seconds: 30  # 同一相机同一规则的告警冷却时间（秒）

# 数据库配置
database:
  path: "storage/alerts.db"  # SQLite 告警数据库文件路径
  # 超过保留天数的告警记录自动清理
  retention_days: 180  # 告警记录保留天数

# 日志配置
logging:
  level: "INFO"  # 日志级别：DEBUG/INFO/WARNING/ERROR/CRITICAL
  file: "storage/logs/machine_vision.log"  # 日志文件路径
  max_size_mb: 50  # 单个日志文件大小上限（MB），超过后轮转
  backup_count: 5  # 日志轮转后保留的备份文件数量

# Web 面板配置；panel.enabled=false 时不启动 Web 面板
panel:
  enabled: true
  host: "0.0.0.0"  # 监听地址；0.0.0.0 表示允许局域网访问
  port: 8000  # Web 面板端口
  auth_enabled: true  # 是否启用登录认证
  username: "admin"  # 登录用户名
  password: "请改成强密码"
